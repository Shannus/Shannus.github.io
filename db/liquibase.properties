# Liquibase runtime configuration TEMPLATE — contains NO secrets.
# url / username / password are supplied at runtime by the pipeline, which pulls
# them from AWS Secrets Manager using the OIDC-assumed role (never committed).
#
#   liquibase --url="jdbc:postgresql://$DB_HOST:5432/$DB_NAME" \
#             --username="$DB_USER" --password="$DB_PASSWORD" update
changeLogFile=changelog/db.changelog-master.xml
driver=org.postgresql.Driver
# Parameter drives per-tenant logical isolation; overridable with -Dtenant=<name>
liquibase.parameter.tenant=public
